name: Backend CI

on:
  push:
    branches:
      - main
      - feature/backend-native-10.4
  pull_request:
    paths:
      - 'backend/**'
      - 'admin-web/**'
      - 'scripts/test_api.sh'
      - 'scripts/test_web.sh'
      - 'scripts/api_tests/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: backend/go.sum

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/legacystore-backend

      - name: Validate web JavaScript
        working-directory: .
        run: node --check admin-web/static/app.js

      - name: Validate nginx configuration inputs
        working-directory: .
        run: |
          test -s admin-web/static/index.html
          test -s admin-web/static/styles.css
          test -s admin-web/static/ui-fixes.css
          test -s admin-web/nginx.conf
          grep -q 'proxy_request_buffering off' admin-web/nginx.conf
          grep -q 'Content-Security-Policy' admin-web/nginx.conf

  integration:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: legacystore_test
          POSTGRES_USER: legacystore
          POSTGRES_PASSWORD: legacystore_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legacystore -d legacystore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://legacystore:legacystore_test_password@127.0.0.1:5432/legacystore_test?sslmode=disable
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8080
      PUBLIC_BASE_URL: http://localhost:8080
      TRUST_PROXY_HEADERS: 'true'
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /tmp/legacystore-ci-storage
      MAX_UPLOAD_BYTES: '104857600'
      CATALOG_SIGNING_ENABLED: 'true'
      CATALOG_PRIVATE_KEY_PATH: /tmp/legacystore-ci-catalog-private.pem
      CATALOG_PUBLIC_KEY_PATH: /tmp/legacystore-ci-catalog-public.pem
      ADMIN_EMAIL: ci-admin@legacystore.local
      ADMIN_PASSWORD: 'CI-Admin-Password-2026!'
      ADMIN_NICKNAME: CI Administrator
      API_TEST_ADMIN_EMAIL: ci-admin@legacystore.local
      API_TEST_ADMIN_PASSWORD: 'CI-Admin-Password-2026!'
      RECOVERY_BASE_URL: https://localhost:8443/account/recovery
      RECOVERY_DEBUG_RETURN_TOKEN: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: backend/go.sum

      - name: Install API test dependencies
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Apply migrations
        working-directory: backend
        run: |
          set -euo pipefail
          for migration in migrations/*.up.sql; do
            echo "Applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Load fixtures without seeded administrator
        working-directory: backend
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f fixtures/seed.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM users WHERE lower(email) = 'admin@legacystore.local';"

      - name: Generate catalog signing key pair
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$CATALOG_PRIVATE_KEY_PATH"
          openssl pkey -in "$CATALOG_PRIVATE_KEY_PATH" -pubout -out "$CATALOG_PUBLIC_KEY_PATH"
          chmod 600 "$CATALOG_PRIVATE_KEY_PATH"

      - name: Start backend
        working-directory: backend
        run: |
          set -euo pipefail
          rm -rf "$LOCAL_STORAGE_PATH"
          mkdir -p "$LOCAL_STORAGE_PATH"
          go run ./cmd/legacystore-backend >../backend-integration.log 2>&1 &
          echo $! >../backend-integration.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ../backend-integration.log
          exit 1

      - name: Verify production admin provisioning in database
        run: |
          set -euo pipefail
          admin_count=$(psql "$DATABASE_URL" -Atc "SELECT COUNT(*) FROM user_roles ur JOIN roles r ON r.id = ur.role_id WHERE r.name = 'admin';")
          admin_email=$(psql "$DATABASE_URL" -Atc "SELECT lower(u.email) FROM user_roles ur JOIN roles r ON r.id = ur.role_id JOIN users u ON u.id = ur.user_id WHERE r.name = 'admin';")
          test "$admin_count" = "1"
          test "$admin_email" = "ci-admin@legacystore.local"

      - name: Run API integration and security tests
        env:
          BASE_URL: http://localhost:8080
        run: ./scripts/test_api.sh

      - name: Generate local web TLS certificate
        run: |
          set -euo pipefail
          mkdir -p admin-web/certs
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout admin-web/certs/localhost.key \
            -out admin-web/certs/localhost.crt \
            -days 1 \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          chmod 600 admin-web/certs/localhost.key

      - name: Start HTTPS web proxy
        run: |
          set -euo pipefail
          docker run -d --name legacystore-web-ci \
            --add-host backend:host-gateway \
            -p 8081:80 \
            -p 8443:443 \
            -v "$PWD/admin-web/static:/usr/share/nginx/html:ro" \
            -v "$PWD/admin-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/admin-web/certs:/etc/nginx/certs:ro" \
            nginx:1.27-alpine
          for attempt in $(seq 1 30); do
            if curl -kfsS https://localhost:8443/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs legacystore-web-ci
          exit 1

      - name: Run web frontend/backend integration tests
        env:
          WEB_URL: https://localhost:8443
        run: ./scripts/test_web.sh

      - name: Show backend and web logs on failure
        if: failure()
        run: |
          cat backend-integration.log || true
          docker logs legacystore-web-ci || true

      - name: Stop web proxy
        if: always()
        run: docker rm -f legacystore-web-ci >/dev/null 2>&1 || true

      - name: Stop backend
        if: always()
        run: |
          if [ -f backend-integration.pid ]; then
            kill "$(cat backend-integration.pid)" 2>/dev/null || true
          fi
