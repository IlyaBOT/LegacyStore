name: Backend CI

on:
  push:
    branches:
      - main
      - feature/backend-native-10.4
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/test_api.sh'
      - 'scripts/api_tests/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: backend/go.sum

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/legacystore-backend

  integration:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: legacystore_test
          POSTGRES_USER: legacystore
          POSTGRES_PASSWORD: legacystore_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legacystore -d legacystore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://legacystore:legacystore_test_password@127.0.0.1:5432/legacystore_test?sslmode=disable
      BACKEND_HOST: 127.0.0.1
      BACKEND_PORT: 8080
      PUBLIC_BASE_URL: http://localhost:8080
      TRUST_PROXY_HEADERS: 'true'
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /tmp/legacystore-ci-storage
      MAX_UPLOAD_BYTES: '104857600'
      CATALOG_SIGNING_ENABLED: 'true'
      CATALOG_PRIVATE_KEY_PATH: /tmp/legacystore-ci-catalog-private.pem
      CATALOG_PUBLIC_KEY_PATH: /tmp/legacystore-ci-catalog-public.pem
      ADMIN_EMAIL: ci-admin@legacystore.local
      ADMIN_PASSWORD: 'CI-Admin-Password-2026!'
      ADMIN_NICKNAME: CI Administrator
      API_TEST_ADMIN_EMAIL: ci-admin@legacystore.local
      API_TEST_ADMIN_PASSWORD: 'CI-Admin-Password-2026!'
      RECOVERY_DEBUG_RETURN_TOKEN: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: backend/go.sum

      - name: Install API test dependencies
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Apply migrations
        working-directory: backend
        run: |
          set -euo pipefail
          for migration in migrations/*.up.sql; do
            echo "Applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Load fixtures without seeded administrator
        working-directory: backend
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f fixtures/seed.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM users WHERE lower(email) = 'admin@legacystore.local';"

      - name: Generate catalog signing key pair
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$CATALOG_PRIVATE_KEY_PATH"
          openssl pkey -in "$CATALOG_PRIVATE_KEY_PATH" -pubout -out "$CATALOG_PUBLIC_KEY_PATH"
          chmod 600 "$CATALOG_PRIVATE_KEY_PATH"

      - name: Start backend
        working-directory: backend
        run: |
          set -euo pipefail
          rm -rf "$LOCAL_STORAGE_PATH"
          mkdir -p "$LOCAL_STORAGE_PATH"
          go run ./cmd/legacystore-backend >../backend-integration.log 2>&1 &
          echo $! >../backend-integration.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ../backend-integration.log
          exit 1

      - name: Verify production admin provisioning in database
        run: |
          set -euo pipefail
          admin_count=$(psql "$DATABASE_URL" -Atc "SELECT COUNT(*) FROM user_roles ur JOIN roles r ON r.id = ur.role_id WHERE r.name = 'admin';")
          admin_email=$(psql "$DATABASE_URL" -Atc "SELECT lower(u.email) FROM user_roles ur JOIN roles r ON r.id = ur.role_id JOIN users u ON u.id = ur.user_id WHERE r.name = 'admin';")
          test "$admin_count" = "1"
          test "$admin_email" = "ci-admin@legacystore.local"

      - name: Run API integration and security tests
        env:
          BASE_URL: http://localhost:8080
        run: ./scripts/test_api.sh

      - name: Show backend log on failure
        if: failure()
        run: cat backend-integration.log || true

      - name: Stop backend
        if: always()
        run: |
          if [ -f backend-integration.pid ]; then
            kill "$(cat backend-integration.pid)" 2>/dev/null || true
          fi
