services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legacystore}
      POSTGRES_USER: ${POSTGRES_USER:-legacystore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legacystore_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-legacystore} -d $${POSTGRES_DB:-legacystore}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: 8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost:8443}
      DATABASE_URL: ${DATABASE_URL:-postgres://legacystore:legacystore_dev_password@postgres:5432/legacystore?sslmode=disable}
      # In this Compose topology the backend is externally reachable only on loopback;
      # nginx is the public TLS terminator on the Docker network.
      TRUST_PROXY_HEADERS: 'true'
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-Administrator}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/data/storage}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-8589934592}
      CATALOG_SIGNING_ENABLED: ${CATALOG_SIGNING_ENABLED:-false}
      CATALOG_PUBLIC_KEY_PATH: ${CATALOG_PUBLIC_KEY_PATH:-}
      CATALOG_PRIVATE_KEY_PATH: ${CATALOG_PRIVATE_KEY_PATH:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      RECOVERY_BASE_URL: ${RECOVERY_BASE_URL:-https://localhost:8443/account}
      RECOVERY_DEBUG_RETURN_TOKEN: ${RECOVERY_DEBUG_RETURN_TOKEN:-false}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    expose:
      - "8080"
    volumes:
      - ./backend:/app
      - ./build:/workspace/build
      - storage_data:/data/storage
      - ./secrets:/run/secrets/legacystore:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12

  admin-web:
    image: nginx:1.27-alpine
    ports:
      - "${ADMIN_WEB_PORT:-8081}:80"
      - "${ADMIN_WEB_HTTPS_PORT:-8443}:443"
    volumes:
      - ./admin-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./admin-web/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  storage_data:
