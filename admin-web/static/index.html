<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>LegacyStore</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/ui-fixes.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="history-controls" aria-label="Navigation history">
          <button class="history-button" id="backButton" type="button" aria-label="Back">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.8 5.2 8 12l6.8 6.8"/></svg>
          </button>
          <button class="history-button next" id="forwardButton" type="button" aria-label="Forward">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.2 5.2 6.8 6.8-6.8 6.8"/></svg>
          </button>
        </div>

        <nav class="toolbar-tabs" aria-label="Primary">
          <button class="toolbar-tab is-active" data-route="home" type="button">
            <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.7 2.8 5.7 6.3.9-4.6 4.5 1.1 6.3-5.6-3-5.6 3 1.1-6.3-4.6-4.5 6.3-.9Z"/></svg>
            <span>Featured</span>
          </button>
          <button class="toolbar-tab" data-route="top-charts" type="button">
            <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V10h4v9H4Zm6 0V5h4v14h-4Zm6 0v-7h4v7h-4Z"/></svg>
            <span>Top Charts</span>
          </button>
          <button class="toolbar-tab" data-route="categories" type="button">
            <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4V4Zm10 0h6v6h-6V4ZM4 14h6v6H4v-6Zm10 0h6v6h-6v-6Z"/></svg>
            <span>Categories</span>
          </button>
          <button class="toolbar-tab" data-route="downloads" type="button">
            <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 20h14"/></svg>
            <span>Downloads</span>
          </button>
          <button class="toolbar-tab" data-route="updates" type="button">
            <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 7V3m0 0h-4m4 0-3.1 3.1A7.5 7.5 0 1 0 19.2 13"/></svg>
            <span>Updates</span>
          </button>
        </nav>

        <form class="search-box" id="searchForm" role="search">
          <svg class="search-glass-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
          <input id="searchInput" name="q" type="search" autocomplete="off" aria-label="Search LegacyStore" placeholder="Search">
        </form>
      </header>

      <div class="layout">
        <aside class="sidebar" id="sidebar" aria-label="Sources"></aside>
        <main class="main" id="main" tabindex="-1"></main>
      </div>

      <footer class="statusbar">
        <div id="statusLeft">Showing: All Categories</div>
        <div id="statusCenter">0 items</div>
        <div id="statusRight">Sort By: Featured</div>
      </footer>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
